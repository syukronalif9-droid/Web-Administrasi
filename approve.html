<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Surat Perintah Lembur - GGF Warehouse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            padding: 32px 28px;
            text-align: center;
        }
        .status-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 32px;
        }
        .icon-success {
            background-color: #dcfce7;
            color: #16a34a;
        }
        .icon-danger {
            background-color: #fee2e2;
            color: #dc2626;
        }
        .icon-loading {
            background-color: #e0f2fe;
            color: #0284c7;
        }
        .icon-waiting {
            background-color: #fef3c7;
            color: #d97706;
        }
        h1 {
            font-size: 1.25rem;
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            font-size: 0.88rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .spl-detail {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
            font-size: 0.82rem;
        }
        .spl-detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px dashed #e2e8f0;
        }
        .spl-detail-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .spl-detail-label {
            color: #64748b;
        }
        .spl-detail-val {
            font-weight: 600;
            color: #0f172a;
            text-align: right;
        }
        .btn-action {
            display: inline-block;
            background-color: #0f172a;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn-action:hover {
            background-color: #1e293b;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-success { background: #dcfce7; color: #16a34a; }
        .badge-danger { background: #fee2e2; color: #dc2626; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0284c7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card" id="app-card">
        <!-- Result State -->
        <div id="state-result">
            <div id="result-icon" class="status-icon icon-waiting">!</div>
            <h1 id="result-title">Menunggu Konfirmasi</h1>
            <p id="result-desc">Keputusan hanya disimpan setelah Anda menekan tombol Setujui atau Tolak di halaman ini.</p>

            <div class="spl-detail" id="spl-info-box">
                <div class="spl-detail-row">
                    <span class="spl-detail-label">No. SPL</span>
                    <span class="spl-detail-val" id="disp-spl-no">-</span>
                </div>
                <div class="spl-detail-row">
                    <span class="spl-detail-label">Approver</span>
                    <span class="spl-detail-val" id="disp-approver-name">-</span>
                </div>
                <div class="spl-detail-row">
                    <span class="spl-detail-label">Status Akhir</span>
                    <span class="spl-detail-val" id="disp-status">-</span>
                </div>
                <div class="spl-detail-row">
                    <span class="spl-detail-label">Waktu Eksekusi</span>
                    <span class="spl-detail-val" id="disp-time">-</span>
                </div>
            </div>

            <!-- Keputusan email hanya diproses setelah approver menekan salah satu tombol ini. -->
            <div style="margin-bottom: 14px;">
                <div style="font-size: 0.78rem; color: #64748b; margin-bottom: 8px; font-weight: 600;">Konfirmasi keputusan Anda secara manual:</div>
                <div style="display: flex; gap: 8px;">
                    <button type="button" id="btn-do-approve" onclick="executeDecision(true)" style="flex: 1; background: #16a34a; color: white; border: none; padding: 10px 12px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                        <span>✓ Setujui</span>
                    </button>
                    <button type="button" id="btn-do-reject" onclick="executeDecision(false)" style="flex: 1; background: #dc2626; color: white; border: none; padding: 10px 12px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                        <span>✕ Tolak (Reject)</span>
                    </button>
                </div>
            </div>

            <a href="dashboard.html" class="btn-action">Buka Dashboard Monitoring</a>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bavacuaqbbwnqbrcldsj.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhdmFjdWFxYmJ3bnFicmNsZHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODc2MjMsImV4cCI6MjEwNjQ2MzYyM30.2KTBo_y89dexhQUq70VECQvl03iho2_Bx06qDu3IETc';
        let supabaseConfigError = '';
        const supabaseClient = (() => {
            if (!window.supabase) {
                supabaseConfigError = 'Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.';
                return null;
            }
            if (!supabaseKey || /^\*+$/.test(supabaseKey)) {
                supabaseConfigError = 'Supabase anon/publishable key belum dikonfigurasi. Hubungi administrator aplikasi.';
                return null;
            }
            try {
                return window.supabase.createClient(supabaseUrl, supabaseKey);
            } catch (error) {
                supabaseConfigError = `Koneksi Supabase gagal disiapkan: ${error.message || error}`;
                return null;
            }
        })();

        // Helper untuk ekstrak query parameter secara kebal terhadap &amp; dari EmailJS
        function getQueryParam(key) {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has(key)) return urlParams.get(key);
            if (urlParams.has('amp;' + key)) return urlParams.get('amp;' + key);
            if (urlParams.has('amp%3B' + key)) return urlParams.get('amp%3B' + key);
            
            // Regex fallback pada raw search string
            const regex = new RegExp('(?:[?&]|&amp;)' + key + '=([^&]+)', 'i');
            const match = window.location.search.match(regex);
            return match ? decodeURIComponent(match[1]) : null;
        }

        const splId = getQueryParam('id') || '';
        const paramSplNo = getQueryParam('spl_no') || '';
        const paramApprover = getQueryParam('approver') || '';
        const role = (getQueryParam('role') || 'kabag').trim().toLowerCase();
        const actionParam = (getQueryParam('action') || '').trim().toLowerCase();

        // Deteksi secara mutlak jika aksi adalah tolak / reject
        const isInitialReject = ['reject', 'tolak', 'rejected'].includes(actionParam);

        async function executeDecision(isApproved) {
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const setError = message => {
                icon.className = 'status-icon icon-danger';
                icon.textContent = '!';
                title.textContent = 'Persetujuan belum tersimpan';
                desc.textContent = message;
                document.getElementById('disp-status').textContent = 'Gagal diproses';
                document.getElementById('disp-time').textContent = new Date().toLocaleString('id-ID');
            };

            if (!supabaseClient) {
                setError(supabaseConfigError || 'Koneksi Supabase tidak tersedia. Keputusan belum disimpan.');
                return;
            }
            if (!splId) {
                setError('Tautan approval tidak memuat ID SPL yang valid.');
                return;
            }

            const approveButton = document.getElementById('btn-do-approve');
            const rejectButton = document.getElementById('btn-do-reject');
            approveButton.disabled = true;
            rejectButton.disabled = true;
            title.textContent = 'Memproses Keputusan...';
            desc.textContent = 'Memeriksa data SPL dan menyimpan keputusan ke Supabase.';

            try {
                const { data: row, error: readError } = await supabaseClient
                    .from('digital_spl')
                    .select('id, spl_no, kabag, manager, final_status, data')
                    .eq('id', splId)
                    .maybeSingle();
                if (readError) throw new Error(`Gagal membaca data SPL: ${readError.message}`);
                if (!row) throw new Error(`Data SPL ${paramSplNo || splId} tidak ditemukan. Tautan dari email uji tidak dapat menyetujui pengajuan sungguhan.`);

                const targetSpl = row.data && typeof row.data === 'object' ? { ...row.data } : {};
                const currentStatus = row.final_status || targetSpl.finalStatus || '';
                const kabag = row.kabag && typeof row.kabag === 'object' ? row.kabag : targetSpl.kabag || {};
                const manager = row.manager && typeof row.manager === 'object' ? row.manager : targetSpl.manager || {};
                let finalStatus;

                if (role === 'kabag') {
                    if (currentStatus !== 'Menunggu Kabag' || (kabag.status && kabag.status !== 'pending')) {
                        throw new Error(`Pengajuan tidak sedang menunggu persetujuan Kabag (status: ${currentStatus || 'tidak diketahui'}).`);
                    }
                    targetSpl.kabag = { ...kabag, status: isApproved ? 'approved' : 'rejected', date: new Date().toLocaleString('id-ID') };
                    finalStatus = isApproved ? 'Menunggu Manager' : 'Ditolak Kabag';
                } else if (role === 'manager') {
                    if (currentStatus !== 'Menunggu Manager' || kabag.status !== 'approved' || (manager.status && manager.status !== 'pending')) {
                        throw new Error(`Pengajuan belum disetujui Kabag atau tidak sedang menunggu Manager (status: ${currentStatus || 'tidak diketahui'}).`);
                    }
                    targetSpl.manager = { ...manager, status: isApproved ? 'approved' : 'rejected', date: new Date().toLocaleString('id-ID') };
                    finalStatus = isApproved ? 'Disetujui' : 'Ditolak Manager';
                } else {
                    throw new Error('Peran approver pada tautan tidak valid.');
                }

                targetSpl.id = row.id;
                targetSpl.splNo = row.spl_no || targetSpl.splNo || paramSplNo;
                targetSpl.finalStatus = finalStatus;
                const { data: updatedRow, error: updateError } = await supabaseClient
                    .from('digital_spl')
                    .update({
                        kabag: targetSpl.kabag || kabag,
                        manager: targetSpl.manager || manager,
                        final_status: finalStatus,
                        data: targetSpl,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', row.id)
                    .eq('final_status', currentStatus)
                    .select('id')
                    .maybeSingle();
                if (updateError) throw new Error(`Gagal menyimpan keputusan ke Supabase: ${updateError.message}`);
                if (!updatedRow) throw new Error('Status SPL berubah saat keputusan diproses. Muat ulang halaman untuk melihat status terbaru.');

                const approverName = paramApprover || (role === 'manager' ? 'Manager' : 'Kabag');
                const nowStr = new Date().toLocaleString('id-ID');
                icon.className = isApproved ? 'status-icon icon-success' : 'status-icon icon-danger';
                icon.textContent = isApproved ? '✓' : '✕';
                title.textContent = isApproved ? 'Surat Perintah Lembur Disetujui!' : 'Surat Perintah Lembur Ditolak';
                desc.textContent = `Keputusan berhasil disimpan di Supabase oleh ${approverName} (${role.toUpperCase()}).`;
                document.getElementById('disp-spl-no').textContent = targetSpl.splNo;
                document.getElementById('disp-approver-name').textContent = approverName;
                document.getElementById('disp-status').textContent = finalStatus;
                document.getElementById('disp-time').textContent = nowStr;
            } catch (error) {
                console.error('Approval processing failed:', error);
                setError(error.message || 'Terjadi kesalahan saat menyimpan keputusan.');
                approveButton.disabled = false;
                rejectButton.disabled = false;
            }
        }

        document.getElementById('disp-spl-no').textContent = paramSplNo || '-';
        document.getElementById('disp-approver-name').textContent = paramApprover || '-';
        document.getElementById('disp-status').textContent = 'Menunggu Konfirmasi';
        document.getElementById('disp-time').textContent = '-';
        document.getElementById('result-title').textContent = isInitialReject
            ? 'Konfirmasi Penolakan'
            : 'Konfirmasi Persetujuan';
        document.getElementById('result-desc').textContent = isInitialReject
            ? 'Tautan ini meminta penolakan. Keputusan belum disimpan; tekan Tolak untuk mengonfirmasi.'
            : 'Tautan ini meminta persetujuan. Keputusan belum disimpan; tekan Setujui untuk mengonfirmasi.';
    </script>
</body>
</html>
