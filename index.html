<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOT System - Attendance &amp; OverTime System</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #2563eb;
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle modern background decorative shapes */
        .bg-shape-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 70%);
            top: -100px;
            left: -100px;
            pointer-events: none;
        }

        .bg-shape-2 {
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(96,165,250,0.2) 0%, rgba(255,255,255,0) 70%);
            bottom: -150px;
            right: -100px;
            pointer-events: none;
        }

        /* Main Floating Card */
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 960px;
            border-radius: 36px;
            box-shadow: 0 25px 70px -12px rgba(15, 23, 42, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.4);
            display: grid;
            grid-template-columns: 1fr 1.05fr;
            overflow: hidden;
            position: relative;
            z-index: 10;
            min-height: 580px;
        }

        /* =========================================
           LEFT PANE: FORM LOGIN
           ========================================= */
        .auth-form-pane {
            padding: 48px 46px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
        }

        .auth-header {
            margin-bottom: 24px;
        }

        .auth-logo {
            margin-bottom: 16px;
        }

        .auth-logo img {
            width: 100%;
            max-width: 330px;
            height: auto;
            max-height: 125px;
            object-fit: contain;
            display: block;
        }

        .auth-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.4px;
            margin-bottom: 0;
        }

        .auth-subtitle {
            font-size: 0.88rem;
            color: #64748b;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .form-label {
            font-size: 0.84rem;
            font-weight: 600;
            color: #475569;
        }

        .forgot-link {
            font-size: 0.82rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
        }

        .forgot-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            height: 48px;
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 0.92rem;
            font-family: inherit;
            color: #0f172a;
            font-weight: 500;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .form-input:focus {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .password-toggle-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.15s;
        }

        .password-toggle-btn:hover {
            color: #334155;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 14px 0 24px;
            cursor: pointer;
            user-select: none;
        }

        .custom-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
            border-radius: 4px;
        }

        .remember-label {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-submit-login {
            width: 100%;
            height: 50px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 0.98rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px -4px rgba(37, 99, 235, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit-login:hover {
            background: #1d4ed8;
            box-shadow: 0 12px 28px -4px rgba(37, 99, 235, 0.55);
            transform: translateY(-1px);
        }

        .btn-submit-login:active {
            transform: translateY(1px);
            box-shadow: 0 4px 14px -2px rgba(37, 99, 235, 0.4);
        }

        .auth-footer {
            margin-top: 26px;
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
        }

        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.15s;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .quick-guest-btn {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            color: #64748b;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 14px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .quick-guest-btn:hover {
            background: #eff6ff;
            color: #2563eb;
            border-color: #93c5fd;
        }

        /* =========================================
           RIGHT PANE: 3D ILLUSTRATION & HERO
           ========================================= */
        .auth-visual-pane {
            /* Disamakan persis dengan warna latar gambar ilustrasi (#ecf0f7) agar menyatu */
            background: #ecf0f7;
            border-left: 1px solid #e2e8f0;
            padding: 44px 38px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
        }

        .illustration-wrapper {
            width: 100%;
            max-width: 430px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 12px;
        }

        .login-illustration-img {
            width: 100%;
            height: auto;
            display: block;
            /* Tepi gambar dibuat memudar halus agar tidak ada garis kotak sama sekali */
            -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%);
                    mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%);
            animation: illustrationFloat 6s ease-in-out infinite;
            user-select: none;
            -webkit-user-drag: none;
        }

        @keyframes illustrationFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-illustration-img { animation: none; }
        }

        .visual-content {
            margin-top: auto;
            max-width: 340px;
        }

        .visual-title {
            font-size: 1.32rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .visual-desc {
            font-size: 0.82rem;
            color: #64748b;
            line-height: 1.55;
            margin-bottom: 22px;
        }

        /* Slider Dashes */
        .slider-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .slider-dash {
            height: 4px;
            border-radius: 99px;
            background: #cbd5e1;
            transition: all 0.3s ease;
        }

        .slider-dash.active {
            width: 38px;
            background: #2563eb;
        }

        .slider-dash.inactive {
            width: 16px;
        }

        /* Responsive Layout */
        @media (max-width: 820px) {
            .auth-card {
                grid-template-columns: 1fr;
                max-width: 440px;
                border-radius: 28px;
                min-height: auto;
            }

            .auth-form-pane {
                padding: 38px 28px 32px;
            }

            .auth-visual-pane {
                display: none; /* Compact on mobile for fastest login UX */
            }
        }
    </style>
</head>
<body>

    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <div class="auth-card">
        <!-- LEFT: LOGIN FORM -->
        <div class="auth-form-pane">
            <div>
                <div class="auth-header">
                    <div class="auth-logo">
                        <img src="assets/logo-ggf.jpg" alt="Logo Great Giant Foods">
                    </div>
                </div>

                <form id="loginForm">
                    <!-- Field 1: Username or Email -->
                    <div class="form-group">
                        <div class="form-label-row">
                            <label for="usernameInput" class="form-label">Username or email</label>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="usernameInput" class="form-input" placeholder="Enter username or email" required autocomplete="username">
                        </div>
                    </div>

                    <!-- Field 2: Password -->
                    <div class="form-group">
                        <div class="form-label-row">
                            <label for="passwordInput" class="form-label">Password</label>
                            <a href="javascript:void(0)" class="forgot-link" onclick="handleForgotPassword()">Forgot password ?</a>
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 44px;">
                            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <label class="remember-row">
                        <input type="checkbox" id="rememberMe" class="custom-checkbox" checked>
                        <span class="remember-label">Remember me</span>
                    </label>

                    <!-- Login Button -->
                    <button type="submit" class="btn-submit-login">
                        <span>Login</span>
                    </button>

                    <!-- Quick Guest / Demo Option -->
                    <button type="button" class="quick-guest-btn" onclick="loginAsGuest()">
                        <span>⚡ Masuk Cepat (Guest / Demo Mode)</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- RIGHT: 3D PROJECT PROGRESS ILLUSTRATION -->
        <div class="auth-visual-pane">
            <div class="illustration-wrapper">
                <img src="assets/login-illustration.jpg" alt="Ilustrasi 3D dashboard analitik dan progres proyek" class="login-illustration-img" width="1200" height="896">
            </div>

            <!-- Title & Description -->
            <div class="visual-content">
                <h3 class="visual-title">AOT System</h3>
                <p class="visual-desc">
                    <strong>Attendance &amp; OverTime System</strong>. Integrated platform untuk monitoring kehadiran &amp; overtime (SPL) secara real-time.
                </p>
            </div>
        </div>
    </div>

    <!-- Supabase Client & Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Initialization
        const supabaseUrl = 'https://bavacuaqbbwnqbrcldsj.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhdmFjdWFxYmJ3bnFicmNsZHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODc2MjMsImV4cCI6MjEwNjQ2MzYyM30.2KTBo_y89dexhQUq70VECQvl03iho2_Bx06qDu3IETc';
        try {
            window.supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        } catch(e) {}

        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', function() {
            // Restore remembered username if present
            const savedUsername = localStorage.getItem('SPL_REMEMBERED_USER');
            if (savedUsername) {
                const uInp = document.getElementById('usernameInput');
                if (uInp) uInp.value = savedUsername;
            }
        });

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const pwd = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (!pwd) return;

            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                pwd.type = 'password';
                icon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        // Forgot password notice
        function handleForgotPassword() {
            alert('Lupa kata sandi?\nSilakan hubungi tim IT Administrator Warehouse atau gunakan mode login dengan akun resmi terdaftar Anda.');
        }

        // Quick Guest Login
        function loginAsGuest() {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('SPL_CURRENT_USER_PERS_NO', '3152137');
            localStorage.setItem('AOT_USER_ROLE', 'viewer');
            localStorage.setItem('AOT_USER_NAME', 'Guest Viewer');
            window.location.href = 'dashboard.html';
        }

        // Form Submit Handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const submitBtn = document.querySelector('.btn-submit-login');

            if (rememberMe) {
                localStorage.setItem('SPL_REMEMBERED_USER', username);
            } else {
                localStorage.removeItem('SPL_REMEMBERED_USER');
            }

            // Indikator Loading
            const originalBtnHtml = submitBtn ? submitBtn.innerHTML : '<span>Login</span>';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<span>Memeriksa kredensial...</span>`;
            }

            try {
                let userFound = null;

                if (!window.supabaseClient) {
                    alert('Koneksi ke Supabase belum siap. Pastikan perangkat Anda terhubung ke internet.');
                    return;
                }

                // Cek Autentikasi ke Database Supabase (Tabel app_users)
                const { data, error } = await window.supabaseClient
                    .from('app_users')
                    .select('*')
                    .ilike('username', username)
                    .eq('password', password)
                    .limit(1);

                if (error) {
                    console.error('Supabase query error:', error);
                    alert(`Gagal mengakses tabel akun di Supabase:\n${error.message}\n\nTip: Pastikan Anda sudah menjalankan perintah GRANT pada Supabase SQL Editor.`);
                    return;
                }

                if (Array.isArray(data) && data.length > 0) {
                    userFound = data[0];
                }

                if (userFound) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('AOT_USER_ROLE', userFound.role || 'viewer');
                    localStorage.setItem('AOT_USER_NAME', userFound.name || userFound.username);
                    if (userFound.pers_no) {
                        localStorage.setItem('SPL_CURRENT_USER_PERS_NO', userFound.pers_no);
                    }
                    window.location.href = 'dashboard.html';
                } else {
                    alert(`Username atau password salah!\n\nAnda memasukkan:\n• Username: "${username}"\n• Password: "${password}"\n\nPastikan data ini sama persis dengan yang ada di tabel "app_users" pada Supabase.`);
                }
            } catch (err) {
                console.error('Login error:', err);
                alert(`Terjadi kesalahan sistem:\n${err?.message || err}`);
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnHtml;
                }
            }
        });
    </script>
</body>
</html>
